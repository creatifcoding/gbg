<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob: mediastream:; connect-src 'self'; font-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Specimen capture</title>
    <link rel="stylesheet" href="./capture.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="vanta-label">Catalog capture</p>
        <h1 class="vanta-heading">Shoot, tag, download</h1>
        <p class="vanta-muted">
          Rear camera. ExifTool writes GPS and DateTimeOriginal into the JPEG on this device. Nothing is uploaded. If location is denied, locality stays unknown. Intake will not invent a city.
        </p>
      </header>

      <div class="chips" aria-live="polite">
        <span class="vanta-chip" id="camera-chip" data-state="idle">camera idle</span>
        <span class="vanta-chip" id="geo-chip" data-state="idle">location idle</span>
      </div>

      <div class="stage">
        <video id="preview" playsinline muted autoplay></video>
        <img class="still" id="still" alt="Captured still" hidden />
      </div>

      <div class="actions">
        <button type="button" class="vanta-btn-primary" id="arm">Arm camera</button>
        <button type="button" class="vanta-btn-primary" id="shoot" disabled>Capture still</button>
        <button type="button" class="vanta-btn" id="download" disabled>Download JPEG</button>
      </div>

      <p class="vanta-error" id="error" hidden></p>
      <p class="note" id="note" hidden></p>
    </main>
    <script type="module" src="./capture.js"></script>
  </body>
</html>
