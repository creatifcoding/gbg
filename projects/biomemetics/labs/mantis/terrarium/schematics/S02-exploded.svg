<text x="16" y="224" font-size="2.45" font-weight="normal" text-anchor="start">Subassemblies remain grouped; trail lines follow service axes.</text>
<text x="16" y="228" font-size="2.45" font-weight="normal" text-anchor="start">Rail, carriage, binder and compute brick are removable externally.</text>
<text x="16" y="232" font-size="2.45" font-weight="normal" text-anchor="start">No service operation opens a path from rail metal into wet volume.</text>
