\* ExtractorPipeline.cfg — TLC model checking configuration
\*
\* NumExtractors = 5 models a realistic handler:
\*   Path<String>, State<AppState>, HeaderMap, CustomCtx, Query<HashMap>
\*   (4 FromRequestParts + 1 FromRequest)
\*
\* State space: bounded by 2^N paths (each extractor Ok or Err)
\* For N=5: ~32 paths * ~7 phases = ~224 states
\* For N=8: ~256 paths * ~7 phases = ~1792 states

CONSTANTS
    NumExtractors = 5

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT FirstFailureShortCircuits
INVARIANT HandlerIffAllSucceed
INVARIANT BodyConsumedAtMostOnce
INVARIANT ErrorDeterministic
INVARIANT SequentialOrder
INVARIANT PartsDoNotConsumeBody
INVARIANT ResponseConsistency
INVARIANT ExactlyOneResponse

PROPERTY EventualResponse
PROPERTY EventualHandler
PROPERTY EventualErrorResponse
