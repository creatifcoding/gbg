\* HTTPServer.cfg — TLC model checking configuration
\*
\* State space estimate with MaxConnections = 3, MaxConcurrentIds = 5:
\*   Server states: 3
\*   Active/completed subsets of 1..5: 2^5 * 2^5 constrained by disjoint
\*   connState function: 4^5
\*   Total (approximate): ~50,000-200,000 states
\*
\* For larger models (MaxConnections = 5, MaxConcurrentIds = 8):
\*   ~10M-50M states (still tractable on modern hardware, ~30 min)
\*
\* RECOMMENDATION: Start with small model below, then scale up.

CONSTANTS
    MaxConnections = 3
    MaxConcurrentIds = 5

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT ConnectionBound
INVARIANT DisjointSets
INVARIANT StateConsistency

PROPERTY NoConnectionStarvation
PROPERTY DrainEventuallyCompletes
PROPERTY EventualShutdown
