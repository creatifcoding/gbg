SPECIFICATION Spec

\* Small model: 2 actors, 3 requests, 2 max in-flight
CONSTANTS
    NumActors = 2
    MaxRequests = 3
    MaxInFlight = 2

\* Safety invariants
INVARIANT TypeInvariant
INVARIANT FairnessWithinOne
INVARIANT CrashedActorNoNewRequests
INVARIANT NoDoubleProcessing
INVARIANT InFlightSubsetDispatched
INVARIANT CompletedSubsetDispatched
INVARIANT InFlightCompletedDisjoint
INVARIANT CapacityBound
INVARIANT AtLeastOneAlive

\* Liveness properties
PROPERTY EventualCompletion
PROPERTY DrainEventuallyCompletes
PROPERTY CrashRecovery
