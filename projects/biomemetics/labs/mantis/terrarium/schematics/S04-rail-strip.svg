<text x="218" y="231" font-size="2.45" font-weight="normal" text-anchor="start">Bent HSD pogo -&gt; link loss; no fallback to raw MIPI on the strip.</text>
<text x="218" y="235" font-size="2.45" font-weight="normal" text-anchor="start">Each V-dock is point-to-point to one MAX96724 input.</text>
<text x="218" y="239" font-size="2.45" font-weight="normal" text-anchor="start">B52 is a labyrinth wiper, not a hermetic cover. EE-23 series UNVERIFIED.</text>
