[package]
name = "pragma-automata"
version = "0.1.0"
edition = "2021"
description = "PRAGMA automata — FSM intent classifier, ambiguity detector, prefix block builder"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
pragma-ipc = { path = "../pragma-ipc" }
# pragma-core wired in P4 when tiered router needs embedding ops.
# FSM classification is pure logic over IntentType (from pragma-ipc).

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
pretty_assertions = "1"
