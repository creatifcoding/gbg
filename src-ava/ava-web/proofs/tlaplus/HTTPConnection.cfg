\* HTTPConnection.cfg — TLC model checking configuration
\*
\* State space estimate with MaxPipelineDepth = 3:
\*   States: ~9 * 4 * 2 * 2 = ~144 (very tractable)
\*   With error paths: ~200-300 states

CONSTANTS
    MaxPipelineDepth = 3

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT PipelineBound
INVARIANT ExtractionRequiresRoute
INVARIANT HandlerRequiresExtraction

PROPERTY EventualResponseOrClose
PROPERTY EventualTermination
PROPERTY KeepAliveProgress
