[package]
name = "mantis-lab-verifier"
version = "0.1.0"
edition = "2021"
description = "Deterministic artifact verifier for the durable mantis biomimetics lab"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.83"

[lib]
name = "mantis_lab_verifier"
path = "src/lib.rs"

[[bin]]
name = "mantis-lab-verifier"
path = "src/main.rs"

[[bin]]
name = "mantis-corpus"
path = "src/corpus_main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.5.23", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.8"

[dev-dependencies]
tempfile = "=3.14.0"
