name: mantis-procurement-ci

on:
  push:
    paths:
      - "projects/biomemetics/labs/mantis/procurement/**"
      - ".github/workflows/mantis-procurement-ci.yml"
  pull_request:
    paths:
      - "projects/biomemetics/labs/mantis/procurement/**"
      - ".github/workflows/mantis-procurement-ci.yml"

jobs:
  test:
    name: Mantis procurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/biomemetics/labs/mantis/procurement/package-lock.json

      - name: Install dependencies
        working-directory: projects/biomemetics/labs/mantis/procurement
        run: npm ci

      - name: Run tests
        working-directory: projects/biomemetics/labs/mantis/procurement
        run: npm test
