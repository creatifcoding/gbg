# NATS Server Configuration
# Enables JetStream + WebSocket support for browser clients

# Server identity
server_name: tmnl-nats

# JetStream configuration
jetstream {
  store_dir: /data
}

# Standard NATS port
port: 4222

# HTTP monitoring endpoint
http_port: 8222

# WebSocket configuration
websocket {
  # Listen on port 9222 for WebSocket connections
  port: 9222
  
  # No auth for local dev (NEVER do this in production)
  no_tls: true
  
  # CORS settings for browser clients
  same_origin: false
  
  # Compression
  compression: true
}

# Logging
debug: false
trace: false
logtime: true
