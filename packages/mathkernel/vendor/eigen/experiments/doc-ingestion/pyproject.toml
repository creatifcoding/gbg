[project]
name = "doc-ingestion"
version = "0.1.0"
description = "Document ingestion pipeline with OCR, agent workflows, and semantic search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ravyn>=0.3.0",
    "chandra-ocr>=0.1.0",
    "google-adk>=1.5.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
