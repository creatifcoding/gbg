<text x="15" y="204.4" font-size="2.8" font-weight="bold" text-anchor="start">MECHANISM NOTE - CAMERA VIDEO DOCK</text>
<text x="15" y="209" font-size="2.45" font-weight="normal" text-anchor="start">States: free / S1+S2 power-mated / training / link-trained / pinch-safe.</text>
<text x="15" y="213" font-size="2.45" font-weight="normal" text-anchor="start">What moves: binder. V-dock and MAX96724 stay on rail/brick. No tether.</text>
<text x="15" y="217" font-size="2.45" font-weight="normal" text-anchor="start">Raw MIPI never rides B50, B27, or the continuous strip (EE-23/25 lock).</text>
<rect x="215" y="200" width="190" height="19.0" rx="0" class="unverified" fill="#ffffff"/>
<text x="218" y="204.4" font-size="2.8" font-weight="bold" text-anchor="start">FAILURE / WHY / EE-25</text>
<text x="218" y="209" font-size="2.45" font-weight="normal" text-anchor="start">Partial dock or bent HSD: training timeout; Q1 latches off.</text>
<text x="218" y="213" font-size="2.45" font-weight="normal" text-anchor="start">Particle lists IMX519 AF and S5K3P9SX sensors; no orderable SKU drawn.</text>
<text x="218" y="217" font-size="2.45" font-weight="normal" text-anchor="start">EE-26 coupons: 2x-thru, B27-only, B50-only, full channel. Not animal-use.</text>
