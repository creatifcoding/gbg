# AVA Fusion Pipeline — NATS Server Configuration
# See: docs/specifications/rfc/rfc-section-nats-subject-taxonomy.md (AVA.3)

# Listen on all interfaces
listen: 0.0.0.0:4222

# Cluster routing (for future multi-node)
cluster {
  listen: 0.0.0.0:6222
}

# HTTP monitoring
http_port: 8222

# JetStream — persistent message streaming
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Development authorization
authorization {
  token: "ava-dev-token"
}

# Logging
debug: false
trace: false
logtime: true
