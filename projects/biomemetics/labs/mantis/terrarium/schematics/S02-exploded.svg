<text x="218" y="224" font-size="2.45" font-weight="normal" text-anchor="start">1 perimeter -&gt; 2 faces -&gt; 3 ceiling -&gt; 4 false bottom.</text>
<text x="218" y="228" font-size="2.45" font-weight="normal" text-anchor="start">5 animal-isolated rail -&gt; 6 carriage -&gt; 7 SerDes binder -&gt; 8 brick hub.</text>
<text x="218" y="232" font-size="2.45" font-weight="normal" text-anchor="start">First article requires leak, pinch, pull-off and nymph-gap checks.</text>
