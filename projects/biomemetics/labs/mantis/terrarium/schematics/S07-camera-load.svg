<text x="195" y="215" font-size="2.5" font-weight="bold" text-anchor="middle" fill="#0a7891">POWER + VIDEO + REVERSE CONTROL CROSS THE CARRIAGE; NOTHING TETHERS IT</text>
<rect x="12" y="224" width="190" height="19.0" rx="1.2" class="med" fill="#f7f8fa"/>
<text x="15" y="228.4" font-size="2.8" font-weight="bold" text-anchor="start">MECHANISM NOTE - CAMERA VIDEO DOCK</text>
<text x="15" y="233" font-size="2.45" font-weight="normal" text-anchor="start">States: free / S1+S2 power-mated / training / link-trained / pinch-safe.</text>
<text x="15" y="237" font-size="2.45" font-weight="normal" text-anchor="start">Binder moves; V-dock and deserializer are fixed to the rail/brick.</text>
<text x="15" y="241" font-size="2.45" font-weight="normal" text-anchor="start">S1 or S2 opening mutes link and turns local Q1 off before contact motion.</text>
<rect x="215" y="224" width="190" height="19.0" rx="1.2" class="med" fill="#fff0f0"/>
<text x="218" y="228.4" font-size="2.8" font-weight="bold" text-anchor="start">FAILURE / WHY</text>
<text x="218" y="233" font-size="2.45" font-weight="normal" text-anchor="start">Partial dock or bent HSD pin -&gt; bounded training timeout; Q1 latches off.</text>
<text x="218" y="237" font-size="2.45" font-weight="normal" text-anchor="start">Chosen over a CSI tether so the carriage remains genuinely repositionable.</text>
<text x="218" y="241" font-size="2.45" font-weight="normal" text-anchor="start">Coupon and eye/BER tests must include both B27 and B50 interfaces.</text>
