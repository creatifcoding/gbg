questions:
  - Should EntityContract be interface or abstract class?
  - Exact parent constraint enforcement mechanism (compile vs runtime)?

decisions:
  - naming_convention: "{Entity}Schema" postfix for TaggedClasses, namespace pattern for .Schema/.Model/.DDL
  - field_composition: Spread BaseAssetFields.fields (not .extend()) to preserve distinct _tag per entity
  - hierarchy_path: HierarchyPath TaggedClass with segments array + materialized string + algorithmic methods
  - event_bases_divergent: Three separate bases (Structural, Operational, Temporal) - NO common root
  - dual_store: EventLog for domain events, TimescaleDB for temporal data, entityId as join key
  - full_es: All entities event-sourced, hybrid for Sensor/Device (ES config, time-series readings)
  - validation_depth: Defense in depth - TypeScript types + Schema.decode + DDL constraints

findings:
  - deepwiki_taggedclass: Schema.Class.extend keeps parent _tag; use field spread for distinct tags
  - es_vs_crud: DeepWiki recommends ES for Line/Machine (dynamic), CRUD for Enterprise (stable)
  - parallel_agents: 5 architect agents + 1 merger effectively synthesized 200KB of spec docs

