\* RouterDispatch.cfg — TLC model checking configuration
\*
\* This models a realistic router configuration:
\*   - 3 registered routes
\*   - 1 nested router
\*   - Fallback handler configured
\*   - State configured
\*   - 2 middleware layers
\*
\* State space estimate: ~50-100 states (very tractable)
\* The dispatch pipeline is essentially a DAG, so state explosion is minimal.

CONSTANTS
    NumRoutes = 3
    NumNestedRouters = 1
    HasFallback = TRUE
    HasState = TRUE
    NumMiddlewares = 2

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT ExactlyOneResponse
INVARIANT StateBeforeMiddleware
INVARIANT MiddlewareBeforeRouting
INVARIANT DispatchPrecedence
INVARIANT MethodNotAllowedRequiresRoute
INVARIANT NotFoundRequiresNoMatch

PROPERTY EventualResponse
