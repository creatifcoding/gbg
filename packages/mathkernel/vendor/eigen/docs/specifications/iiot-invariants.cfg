\* IIoT Invariants — TLC Model Configuration
\*
\* MINIMAL MODEL: 6 entities forming an ISA-95 hierarchy subtree
\* with cross-domain alarm, equipment, and work order relationships.
\*
\*   PLT ──┐
\*         ├── LIN (child of PLT)
\*         │     └── MCH (child of LIN)
\*         │
\*   EQP ──┤ (equipment for MCH — no hierarchy parent)
\*   ALM ──┘ (alarm for EQP)
\*   WO  ──  (work order for EQP)
\*
\* This covers ALL 4 cross-entity invariant violation classes:
\*   - Hierarchy: PLT → LIN → MCH
\*   - Alarm-Equipment: ALM → EQP
\*   - WorkOrder-Equipment: WO → EQP
\*   - Cascade: PLT decommissioned → LIN/MCH still alive

CONSTANTS
    Entities = {"PLT", "LIN", "MCH", "ALM", "EQP", "WO"}

    ParentOf = [PLT |-> "none",
                LIN |-> "PLT",
                MCH |-> "LIN",
                ALM |-> "EQP",
                EQP |-> "none",
                WO  |-> "EQP"]

    EntityType = [PLT |-> "plant",
                  LIN |-> "line",
                  MCH |-> "machine",
                  ALM |-> "alarm",
                  EQP |-> "equipment",
                  WO  |-> "workorder"]

    NULL = "none"

SPECIFICATION
    Spec

\* =========================================================================
\* INVARIANTS TO CHECK
\* =========================================================================

\* Expected to HOLD — handler enforces graph transitions
INVARIANT GraphIntegrity

\* Expected to be VIOLATED — independent mailboxes, no hierarchy coordination
INVARIANT HierarchyCoherence

\* Expected to be VIOLATED — alarm and equipment are separate entities
INVARIANT AlarmEquipmentCoherence

\* Expected to be VIOLATED — work order and equipment are separate entities
INVARIANT WorkOrderSafety

\* Expected to be VIOLATED — no cascade mechanism
INVARIANT CascadeCompleteness

\* =========================================================================
\* STATE CONSTRAINT — Bound the model for tractability
\* =========================================================================
\*
\* Without a constraint, the state space is infinite (unbounded mailboxes).
\* We limit mailbox depth to 2 messages per entity — sufficient to find
\* all non-commutativity and cross-entity violations.

CONSTRAINT
    \A e \in Entities: Len(mailbox[e]) <= 2

\* =========================================================================
\* PROPERTIES (optional — non-commutativity detection)
\* =========================================================================
\*
\* NonCommutativityDetected is NOT an invariant to check (it's expected
\* to be TRUE in some states). Instead we check its NEGATION as an
\* invariant — TLC will produce a counterexample showing the exact
\* state where non-commutativity occurs.

\* Uncomment to detect non-commutative pairs (will always be violated):
\* INVARIANT ~NonCommutativityDetected
