<text x="217" y="239" font-size="2.45" font-weight="normal" text-anchor="start">S1/S2/Q1/B27/B50 series UNVERIFIED (#23). No MPNs invented.</text>
<text x="217" y="243" font-size="2.45" font-weight="normal" text-anchor="start">P08 diagnostic only. GMSL P10/P11 are not MIPI. EE-26: not animal-use.</text>
