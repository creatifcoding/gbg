<text x="15" y="230.4" font-size="2.8" font-weight="bold" text-anchor="start">MECHANISM NOTE - PROTECTED VIDEO MATE</text>
<text x="15" y="235" font-size="2.45" font-weight="normal" text-anchor="start">States: absent / seated / training / trained / fault / pinch-safe / lifted.</text>
<text x="15" y="239" font-size="2.45" font-weight="normal" text-anchor="start">S1 or S2 opens first; local Q1 turns off and discharges before motion.</text>
<text x="15" y="243" font-size="2.45" font-weight="normal" text-anchor="start">Release seats B27+B50 before a bounded, current-limited training window.</text>
<rect x="214" y="226" width="191" height="19.0" rx="1.2" class="med" fill="#fff0f0"/>
<text x="217" y="230.4" font-size="2.8" font-weight="bold" text-anchor="start">FAULT POLICY</text>
<text x="217" y="235" font-size="2.45" font-weight="normal" text-anchor="start">Bent HSD pin or station skew -&gt; no lock; training times out and Q1 latches off.</text>
<text x="217" y="239" font-size="2.45" font-weight="normal" text-anchor="start">UID identifies load, while V1-V4 deserializer port identifies position.</text>
<text x="217" y="243" font-size="2.45" font-weight="normal" text-anchor="start">P08 is diagnostic only. B27+B50 eye/BER, ESD and timing remain gates.</text>
