# sops config — which files auto-encrypt, and to which age recipient(s).
# The recipient below is a PUBLIC age key (safe to commit). The matching private
# key lives ONLY at ~/.config/sops/age/keys.txt on the mini (never committed).
creation_rules:
  - path_regex: \.sops\.(env|ya?ml|json)$
    age: "age1u5j0634gx0h0f6dpuqr5pe0rzuyr9cp6tflfdyx9apzulqsjy3qs4rvh6e"
