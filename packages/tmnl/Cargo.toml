[workspace]
resolver = "2"
members = [
  "src-tauri",
  "src-shell-tauri",
  "src-panel-tauri",
  "src-shared",
  # PRAGMA — NLP prompt annotation sidecar
  "src/lib/harness/pragma/pragma-ipc",
  "src/lib/harness/pragma/pragma-core",
  "src/lib/harness/pragma/pragma-automata",
  "src/lib/harness/pragma/pragma-sidecar",
]
exclude = [
  "ava-elixir/native/ava_bridge",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
niri-ipc = "=25.11.0"
thiserror = "2"

[patch.crates-io]
wry = { path = "patches/wry-0.54.2" }
tao = { path = "patches/tao-0.34.5" }
tauri-runtime-wry = { path = "patches/tauri-runtime-wry-2.10.0" }
