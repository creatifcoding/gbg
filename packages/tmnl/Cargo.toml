[workspace]
resolver = "2"
members = [
  "src-tauri",
  "src-shell-tauri",
  "src-panel-tauri",
  "src-shared",
]
exclude = [
  "ava-elixir/native/ava_bridge",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
niri-ipc = "=25.11.0"
