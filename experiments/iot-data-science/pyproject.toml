[project]
name = "iot-smoke-detection"
version = "0.1.0"
description = "IoT Smoke Detection ML Pipeline with Prefect"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
    "optax>=0.1.7",
    "prefect>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "flows"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.prefect]
# Prefect configuration
