<text x="97" y="146" font-size="2.5" font-weight="bold" text-anchor="start">SPRING: SELECT AFTER FORCE TEST</text>
<text x="97" y="154" font-size="2.5" font-weight="normal" text-anchor="start">PINCH FORCE 15-25 N TARGET</text>
<text x="97" y="162" font-size="2.5" font-weight="bold" text-anchor="start" fill="#b52d2d">12-CONTACT ARRAY; HSD CELL SI UNVERIFIED</text>
<text x="97" y="170" font-size="2.5" font-weight="normal" text-anchor="start">ROLLER AXLE: M3 REF</text>
<text x="97" y="178" font-size="2.5" font-weight="normal" text-anchor="start">DOVETAIL CLEARANCE 0.25/side TARGET</text>
<rect x="230" y="121" width="175" height="31.0" rx="1.2" class="med" fill="#f7f8fa"/>
<text x="233" y="125.4" font-size="2.8" font-weight="bold" text-anchor="start">MECHANISM NOTE - PINCH-LIFT / ROLL</text>
<text x="233" y="130" font-size="2.45" font-weight="normal" text-anchor="start">States: locked / pinched. Housing and load move; rail is grounded.</text>
<text x="233" y="134" font-size="2.45" font-weight="normal" text-anchor="start">Local S1 opens Q1 and isolates signals before cam lifts contacts.</text>
<text x="233" y="138" font-size="2.45" font-weight="normal" text-anchor="start">Cam lift must exceed pogo overtravel before rollers translate.</text>
<text x="233" y="142" font-size="2.45" font-weight="normal" text-anchor="start">Bent HSD pogo: bounded training times out; local Q1 latches off.</text>
<text x="233" y="146" font-size="2.45" font-weight="normal" text-anchor="start">Release seats clamp and binder, then a bounded link-training window.</text>
<text x="233" y="150" font-size="2.45" font-weight="normal" text-anchor="start">Chosen over screws for one-hand relocation without opening cage.</text>
<rect x="230" y="179" width="175" height="23.0" rx="1.2" class="med" fill="#fff6d9"/>
<text x="233" y="183.4" font-size="2.8" font-weight="bold" text-anchor="start">ACCEPTANCE TARGETS</text>
<text x="233" y="188" font-size="2.45" font-weight="normal" text-anchor="start">Clamp slip: &lt;0.5 mm under 0.5 N-m binder moment.</text>
<text x="233" y="192" font-size="2.45" font-weight="normal" text-anchor="start">Release cycles: 10,000 TARGET; contact resistance vendor-dependent.</text>
<text x="233" y="196" font-size="2.45" font-weight="normal" text-anchor="start">B51 must retain a loaded carriage under the defined handling/drop test.</text>
<text x="233" y="200" font-size="2.45" font-weight="normal" text-anchor="start">No conductive part may breach the wet-side barrier.</text>
