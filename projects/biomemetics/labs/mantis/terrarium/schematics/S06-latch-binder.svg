<rect x="12" y="160" width="190" height="27.0" rx="0" class="med" fill="#ffffff"/>
<text x="15" y="164.4" font-size="2.8" font-weight="bold" text-anchor="start">MECHANISM NOTE - BIND-LATCH</text>
<text x="15" y="169" font-size="2.45" font-weight="normal" text-anchor="start">States: BLOCKED until pinch q&gt;=2.2; then r=1/2/3.5 TARGET.</text>
<text x="15" y="173" font-size="2.45" font-weight="normal" text-anchor="start">Binder housing moves; B28 shoe stays on carriage. Load path bypasses B50.</text>
<text x="15" y="177" font-size="2.45" font-weight="normal" text-anchor="start">First r opens S2 envelope while B50 stays keyed/seated (BRANCH_SAFE dwell).</text>
<text x="15" y="181" font-size="2.45" font-weight="normal" text-anchor="start">Release pin retracts only at PINCH_SAFE. Firmware cannot move that pin.</text>
<text x="15" y="185" font-size="2.45" font-weight="normal" text-anchor="start">Click-latch section has no sourced tongue STEP; deflection 1.2 TARGET stays a note.</text>
<rect x="215" y="160" width="190" height="23.0" rx="0" class="unverified" fill="#ffffff"/>
<text x="218" y="164.4" font-size="2.8" font-weight="bold" text-anchor="start">FAILURE / CLEARANCE</text>
<text x="218" y="169" font-size="2.45" font-weight="normal" text-anchor="start">Partial click: S2 stays open; Q1 remains off. Key blocks 180 reverse mate.</text>
<text x="218" y="173" font-size="2.45" font-weight="normal" text-anchor="start">B50 series/pinout/SI launch UNVERIFIED (#23). Do not invent a connector.</text>
<text x="218" y="177" font-size="2.45" font-weight="normal" text-anchor="start">Camera keep-out 32 is not a sourced module outline.</text>
<text x="218" y="181" font-size="2.45" font-weight="normal" text-anchor="start">PULL-OFF &gt;=40 N TARGET. Side play &lt;=0.20 TARGET.</text>
