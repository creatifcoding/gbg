[project]
name = "sdr-lab"
version = "0.1.0"
description = "FRKNK SDR proving ground for Quisk/Hermes protocol emulation and lossy RF sketches"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pydantic>=2.12.0",
    "typer>=0.12.0",
]

[project.scripts]
sdr-lab = "sdr_lab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdr_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sdr_lab"]
