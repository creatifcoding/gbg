<text x="97" y="154" font-size="2.5" font-weight="normal" text-anchor="start">PINCH FORCE 15-25 N TARGET</text>
<text x="97" y="162" font-size="2.3" font-weight="bold" text-anchor="start" fill="#b52d2d">B27 PROXY d=1 / BARREL 6 UNVERIFIED</text>
<text x="97" y="170" font-size="2.25" font-weight="normal" text-anchor="start">B24 CARRIER 36x32x6; B26 d=8 UNVER</text>
<text x="97" y="178" font-size="2.5" font-weight="bold" text-anchor="start" fill="#b52d2d">MIPI IS NOT ON THESE CONTACTS</text>
<text x="97" y="186" font-size="2.2" font-weight="normal" text-anchor="start">ADR-002: HARDWARE PAWLS, NOT A TIMED DELAY</text>
<rect x="230" y="121" width="175" height="35.0" rx="0" class="med" fill="#ffffff"/>
<text x="233" y="125.4" font-size="2.8" font-weight="bold" text-anchor="start">MECHANISM NOTE - PINCH-LIFT / ROLL</text>
<text x="233" y="130" font-size="2.45" font-weight="normal" text-anchor="start">States: LOCKED / S1_OPEN / PINCH_SAFE / CONTACTS_CLEAR / ROLLING.</text>
<text x="233" y="134" font-size="2.45" font-weight="normal" text-anchor="start">What moves: B24/B27 lift then rollers; rail/B19 stays grounded.</text>
<text x="233" y="138" font-size="2.45" font-weight="normal" text-anchor="start">q=1 opens S1 envelope; contacts stay seated until q=2.2.</text>
<text x="233" y="142" font-size="2.45" font-weight="normal" text-anchor="start">Lift pawl blocks Z until PINCH_SAFE. Throw 2.2 covers 1.8 clearance.</text>
<text x="233" y="146" font-size="2.45" font-weight="normal" text-anchor="start">Translation pawl blocks roll until lift &gt;= clearance. Speed cannot skip a pawl.</text>
<text x="233" y="150" font-size="2.45" font-weight="normal" text-anchor="start">EE-24 S1/S2/Q1 parts UNVERIFIED; electrical dwell is a later independent gate.</text>
<text x="233" y="154" font-size="2.45" font-weight="normal" text-anchor="start">Chosen over screws for one-hand relocate without opening the cage.</text>
<rect x="230" y="191" width="175" height="23.0" rx="0" class="unverified" fill="#ffffff"/>
<text x="233" y="195.4" font-size="2.8" font-weight="bold" text-anchor="start">FAILURE / ACCEPTANCE</text>
<text x="233" y="200" font-size="2.45" font-weight="normal" text-anchor="start">Interrupted pinch: keep Q1 off; require a clean full remate.</text>
<text x="233" y="204" font-size="2.45" font-weight="normal" text-anchor="start">Bent HSD: training timeout; Q1 latches off. No MIPI fallback.</text>
<text x="233" y="208" font-size="2.45" font-weight="normal" text-anchor="start">B51 retains loaded carriage (EE-26 route-retention UNVERIFIED).</text>
<text x="233" y="212" font-size="2.45" font-weight="normal" text-anchor="start">No conductor may breach B20.</text>
