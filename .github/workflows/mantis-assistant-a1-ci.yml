name: Mantis Assistant A1

on:
  pull_request:
    paths:
      - "projects/biomemetics/labs/mantis/assistant/app/**"
      - "projects/biomemetics/labs/mantis/assistant/fixtures/golden-care/**"
      - "projects/biomemetics/labs/mantis/assistant/datasets/golden-care/**"
      - "projects/biomemetics/labs/mantis/assistant/docs/OFFLINE.md"
      - ".github/workflows/mantis-assistant-a1-ci.yml"
  push:
    paths:
      - "projects/biomemetics/labs/mantis/assistant/app/**"
      - "projects/biomemetics/labs/mantis/assistant/fixtures/golden-care/**"
      - "projects/biomemetics/labs/mantis/assistant/datasets/golden-care/**"
      - "projects/biomemetics/labs/mantis/assistant/docs/OFFLINE.md"
      - ".github/workflows/mantis-assistant-a1-ci.yml"
  workflow_dispatch:

concurrency:
  group: mantis-assistant-a1-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: projects/biomemetics/labs/mantis/assistant/app

jobs:
  a1-offline-keeper:
    name: A1 offline keeper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/biomemetics/labs/mantis/assistant/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
