[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mantis-lab"
version = "0.1.0"
description = "Scientific, CAD, and provenance tooling for the mantis biomemetics workspace"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
contracts = ["jsonschema>=4.23"]
science = ["numpy>=2", "scipy>=1.15"]
cad = ["cadquery>=2.5", "build123d>=0.8", "trimesh>=4.6"]
test = ["pytest>=8.3"]

[project.scripts]
mantis-lab = "mantis_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mantis_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

