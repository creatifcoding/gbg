[package]
name = "pragma-core"
version = "0.1.0"
edition = "2021"
description = "PRAGMA core — BERT encoder (Candle), BERTScore, BLEURT (ort), embeddings, drift detection"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
pragma-ipc = { path = "../pragma-ipc" }

# Inference — Candle for BERT hot path, ort for BLEURT scoring
# Build env: use `nix develop .#tmnl-pragma` (not tmnl-tauri) to avoid
# mingw C++ header contamination from cross-compile toolchain.
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }

# Tokenizer (HuggingFace) — esaxx-rs C++ dep needs clean native toolchain
tokenizers = "0.21"

# Math — drift detection, cosine similarity, centroid computation
ndarray = "0.16"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
pretty_assertions = "1"
serial_test = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "inference"
harness = false
