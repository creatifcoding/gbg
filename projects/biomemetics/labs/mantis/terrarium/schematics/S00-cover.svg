<text x="263" y="22.4" font-size="2.8" font-weight="bold" text-anchor="start">SYSTEM THEORY</text>
<text x="263" y="27" font-size="2.45" font-weight="normal" text-anchor="start">250 mm block perimeter; 500 mm first tower.</text>
<text x="263" y="31" font-size="2.45" font-weight="normal" text-anchor="start">P01-P08: protected continuous VIN/GND/I2C/UID/P08.</text>
<text x="263" y="35" font-size="2.45" font-weight="normal" text-anchor="start">P09-P12: indexed GMSL2 only while stationary.</text>
<text x="263" y="39" font-size="2.45" font-weight="normal" text-anchor="start">Raw MIPI stays binder-local and Tachyon-local.</text>
<text x="263" y="43" font-size="2.45" font-weight="normal" text-anchor="start">Pinch is break-before-move; video off while rolling.</text>
<text x="263" y="47" font-size="2.45" font-weight="normal" text-anchor="start">M1/Tachyon brick never enters the animal cage.</text>
<rect x="260" y="70" width="145" height="27.0" rx="0" class="unverified" fill="#ffffff"/>
<text x="263" y="74.4" font-size="2.8" font-weight="bold" text-anchor="start">LOCKED SAFETY BOUNDARY</text>
<text x="263" y="79" font-size="2.45" font-weight="normal" text-anchor="start">Upper-third molt keep-out 142 mm CALCULATED.</text>
<text x="263" y="83" font-size="2.45" font-weight="normal" text-anchor="start">Ceiling/vents: &lt;= 0.8 mm non-metal LOCK.</text>
<text x="263" y="87" font-size="2.45" font-weight="normal" text-anchor="start">B20 is the continuous wet-side barrier (CAD-01 bbox).</text>
<text x="263" y="91" font-size="2.45" font-weight="normal" text-anchor="start">Door front/side; nymph-visible gap &lt;=0.50 TARGET.</text>
<text x="263" y="95" font-size="2.45" font-weight="normal" text-anchor="start">No taxon inferred: no live-mantis photo supplied.</text>
