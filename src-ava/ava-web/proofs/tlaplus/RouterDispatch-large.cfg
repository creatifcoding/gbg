\* RouterDispatch-large.cfg — Scaled-up model with no fallback variant
\*
\* Tests the case where HasFallback = FALSE, which exercises the
\* NotFound path that produces 404 responses.
CONSTANTS
    NumRoutes = 5
    NumNestedRouters = 3
    HasFallback = FALSE
    HasState = TRUE
    NumMiddlewares = 4

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT ExactlyOneResponse
INVARIANT StateBeforeMiddleware
INVARIANT MiddlewareBeforeRouting
INVARIANT DispatchPrecedence
INVARIANT MethodNotAllowedRequiresRoute
INVARIANT NotFoundRequiresNoMatch

PROPERTY EventualResponse
