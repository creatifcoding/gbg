\* MiddlewareChain.cfg — TLC model checking configuration
\*
\* State space estimate with NumMiddlewares = 3:
\*   Position: 4 values (0..3)
\*   Direction: 2 values
\*   ShortCircuited: 2 values
\*   HandlerReached: 2 values
\*   Executed sequence: bounded by 2*N + 2 entries
\*   Total: ~500-1000 states (very tractable)
\*
\* For NumMiddlewares = 5: ~5000-10000 states (still tractable)

CONSTANTS
    NumMiddlewares = 3

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT OnionOrdering
INVARIANT HandlerAtMostOnce
INVARIANT HandlerXorShortCircuit
INVARIANT OutboundReversesInbound
INVARIANT InboundMonotonic

PROPERTY EventualCompletion
