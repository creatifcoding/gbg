[package]
name = "pragma-sidecar"
version = "0.1.0"
edition = "2021"
description = "PRAGMA sidecar binary — JSON-RPC stdio main loop for Tauri sidecar integration"

[[bin]]
name = "pragma-sidecar"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
pragma-ipc = { path = "../pragma-ipc" }
# pragma-core and pragma-automata wired in P4 when handlers go live.
# Until then, the dispatch loop only uses pragma-ipc types.

# Error handling
thiserror = { workspace = true }
anyhow = "1"

# Logging
env_logger = "0.11"
