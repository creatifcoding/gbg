<text x="217" y="231" font-size="2.45" font-weight="normal" text-anchor="start">Panel pressure -&gt; gasket -&gt; pocket wall -&gt; perimeter block.</text>
<text x="217" y="235" font-size="2.45" font-weight="normal" text-anchor="start">500 span bending crosses the internal coupler, not the face cassette.</text>
