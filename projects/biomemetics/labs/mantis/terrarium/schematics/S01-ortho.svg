    .metal { fill:#e1e4e8; stroke:#15171a; stroke-width:.35; }
    .plastic { fill:#f7f8f9; stroke:#15171a; stroke-width:.35; }
    .cut { fill:url(#hatch); stroke:#15171a; stroke-width:.45; }
